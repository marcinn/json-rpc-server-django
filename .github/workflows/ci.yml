name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["20", "21", "22", "31", "32", "40", "41", "42", "50", "51", "52"]
        exclude:
          - python-version: "3.8"
            django-version: "50"
          - python-version: "3.8"
            django-version: "51"
          - python-version: "3.8"
            django-version: "52"
          - python-version: "3.9"
            django-version: "50"
          - python-version: "3.9"
            django-version: "51"
          - python-version: "3.9"
            django-version: "52"
          - python-version: "3.10"
            django-version: "20"
          - python-version: "3.10"
            django-version: "21"
          - python-version: "3.10"
            django-version: "22"
          - python-version: "3.11"
            django-version: "20"
          - python-version: "3.11"
            django-version: "21"
          - python-version: "3.11"
            django-version: "22"
          - python-version: "3.11"
            django-version: "31"
          - python-version: "3.11"
            django-version: "32"
          - python-version: "3.12"
            django-version: "20"
          - python-version: "3.12"
            django-version: "21"
          - python-version: "3.12"
            django-version: "22"
          - python-version: "3.12"
            django-version: "31"
          - python-version: "3.12"
            django-version: "32"
          - python-version: "3.12"
            django-version: "40"
          - python-version: "3.12"
            django-version: "41"
          - python-version: "3.13"
            django-version: "20"
          - python-version: "3.13"
            django-version: "21"
          - python-version: "3.13"
            django-version: "22"
          - python-version: "3.13"
            django-version: "31"
          - python-version: "3.13"
            django-version: "32"
          - python-version: "3.13"
            django-version: "40"
          - python-version: "3.13"
            django-version: "41"
          - python-version: "3.13"
            django-version: "42"
          - python-version: "3.13"
            django-version: "50"


    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Run tox
      run: tox -e py${{ matrix.python-version == '3.10' && '310' || matrix.python-version == '3.11' && '311' || matrix.python-version == '3.12' && '312' || matrix.python-version == '3.13' && '313' || matrix.python-version == '3.8' && '38' || matrix.python-version == '3.9' && '39' }}-django${{ matrix.django-version }}
